# Spring Boot Configuration - FoodRescue Application
spring.application.name=${SPRING_APPLICATION_NAME:foodrescue-system}
server.port=${SERVER_PORT:8080}

# Database Configuration (Configurable via .env file or Environment Variables)
spring.datasource.url=${DB_URL:jdbc:h2:mem:foodrescue_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console Configuration
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT Security Configuration
app.jwtSecret=${JWT_SECRET:FoodRescueSuperSecretKeyForJWTTokenGeneration2026SecureKey!}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Static Resource Handler
spring.sql.init.mode=never
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Scheduled Tasks Enabled
spring.task.scheduling.pool.size=2

# Logging Level
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.com.foodrescue=${LOGGING_LEVEL_APP:DEBUG}
