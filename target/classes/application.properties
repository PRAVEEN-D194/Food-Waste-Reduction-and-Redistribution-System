# Spring Boot Configuration - FoodRescue Application
spring.application.name=foodrescue-system
server.port=8080

# Database Configuration (H2 In-Memory for Instant Out-Of-The-Box Run; MySQL options below)
spring.datasource.url=jdbc:h2:mem:foodrescue_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# For MySQL, uncomment below and update password:
# spring.datasource.url=jdbc:mysql://localhost:3306/foodrescue_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


# Static Resource Handler
spring.sql.init.mode=never
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**


# Scheduled Tasks Enabled
spring.task.scheduling.pool.size=2

# Logging Level
logging.level.org.springframework.web=INFO
logging.level.com.foodrescue=DEBUG
